name: Cocktails
options:
  bundleIdPrefix: com.decentespresso
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: "0.2.0"
    CURRENT_PROJECT_VERSION: "3"
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic

targets:
  Cocktails:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources
      - path: Resources/Fonts
        buildPhase: resources
      # the app icon: the maker's shaker-on-the-scale picture (cocktails/img/maker/shaker-scale.jpg) on white
      - path: Resources/Assets.xcassets
      - path: Resources/Data
        type: folder
        buildPhase: resources
      - path: Resources/Info.plist
        buildPhase: none
    dependencies:
      - sdk: libsqlite3.tbd
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.decentespresso.cocktails
        # the app's name everywhere (Finder, the Mac menu bar, the Dock, the home screen); the Swift
        # module keeps the short name
        PRODUCT_NAME: Decent Cocktails
        PRODUCT_MODULE_NAME: Cocktails
        TARGETED_DEVICE_FAMILY: "1,2,6"
        SUPPORTS_MACCATALYST: YES
        DERIVE_MACCATALYST_PRODUCT_BUNDLE_IDENTIFIER: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_USER_SCRIPT_SANDBOXING: YES
